<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Khairi Bouzakher - Full Stack Developer & AI Enthusiast." />
    <title>Khairi Bouzakher | Portfolio</title>
    
    <link rel="icon" type="image/png" href="/photo/khairibo.png" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- Tailwind CSS - Preload and load with higher priority -->
    <link rel="preload" as="script" href="https://cdn.tailwindcss.com" />
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Inline Critical CSS to prevent FOUC -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      
      /* Hide until CSS loads */
      body.css-loading { opacity: 0; pointer-events: none; }
      body.css-loaded { opacity: 1; pointer-events: auto; transition: opacity 0.3s ease-in; }
      
      /* Minimal base styling */
      body { background: #f5f5f5; color: #000; }
      body.dark { background: #0a0a0a; color: #fff; }
      #root { min-height: 100vh; }
    </style>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Syne', 'sans-serif'],
            },
            colors: {
              darkBg: '#0a0a0a',
              lightBg: '#f5f5f5',
              accentBlue: '#3b82f6',
              accentPurple: '#8b5cf6',
            },
            animation: {
              'blob': 'blob 7s infinite',
            },
            keyframes: {
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              }
            }
          }
        }
      }
    </script>

    <!-- Remove style.css as it requires PostCSS processing -->
  </head>
  <body class="bg-lightBg text-black dark:bg-darkBg dark:text-white transition-colors duration-500 overflow-x-hidden selection:bg-accentPurple selection:text-white antialiased css-loading">
    
    <!-- Custom Cursor -->
    <div id="cursor-dot" class="hidden md:block pointer-events-none fixed top-0 left-0 w-2 h-2 bg-accentBlue rounded-full z-[9999] transform -translate-x-1/2 -translate-y-1/2 transition-transform duration-100 ease-out"></div>
    <div id="cursor-ring" class="hidden md:block pointer-events-none fixed top-0 left-0 w-8 h-8 border border-accentPurple rounded-full z-[9998] transform -translate-x-1/2 -translate-y-1/2 transition-transform duration-300 ease-out"></div>

    <div id="root"></div>

    <!-- Wait for Tailwind CSS to be ready -->
    <script>
      // Suppress CDN warning in production (Tailwind CDN is acceptable for this use case)
      if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
        const originalWarn = console.warn;
        console.warn = function(...args) {
          if (args[0]?.includes?.('cdn.tailwindcss.com')) {
            return; // Suppress Tailwind CDN warning in production
          }
          originalWarn.apply(console, args);
        };
      }

      function waitForTailwind() {
        if (window.tailwind) {
          document.body.classList.remove('css-loading');
          document.body.classList.add('css-loaded');
          console.log('Tailwind CSS ready');
        } else {
          setTimeout(waitForTailwind, 50);
        }
      }
      waitForTailwind();
    </script>

    <!-- Import Map -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1?target=es2022",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?target=es2022",
          "htm": "https://esm.sh/htm@3.1.1?target=es2022",
          "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.45.0?target=es2022"
        }
      }
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="module" src="/js/app.js"></script>
    <script>
      // Cursor logic
      const dot = document.getElementById('cursor-dot');
      const ring = document.getElementById('cursor-ring');
      
      window.addEventListener('mousemove', (e) => {
        dot.style.transform = `translate(${e.clientX}px, ${e.clientY}px) translate(-50%, -50%)`;
        ring.style.transform = `translate(${e.clientX}px, ${e.clientY}px) translate(-50%, -50%)`;
      });

      document.addEventListener('mousedown', () => {
        ring.style.transform += ' scale(0.8)';
        ring.style.backgroundColor = 'rgba(139, 92, 246, 0.2)';
      });
      document.addEventListener('mouseup', () => {
        ring.style.transform = ring.style.transform.replace(' scale(0.8)', '');
        ring.style.backgroundColor = 'transparent';
      });

      // Hover logic for cursor
      document.body.addEventListener('mouseover', (e) => {
        if(e.target.closest('a') || e.target.closest('button')) {
          ring.style.transform += ' scale(1.5)';
          ring.style.borderColor = '#3b82f6';
        }
      });
      document.body.addEventListener('mouseout', (e) => {
        if(e.target.closest('a') || e.target.closest('button')) {
          ring.style.transform = ring.style.transform.replace(' scale(1.5)', '');
          ring.style.borderColor = '#8b5cf6';
        }
      });
    </script>
  </body>
</html>
