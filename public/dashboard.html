<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="User dashboard for secure Google Drive uploads." />
    <title>KBO | User Dashboard</title>

    <link rel="icon" type="image/png" href="/photo/khairibo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>

        theme: {

            fontFamily: {
